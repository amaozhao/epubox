[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]
include = ["main.py"]

[project]
name = "epubox"
version = "0.1.0"
description = ""
authors = []
requires-python = ">=3.13"
dependencies = [
    "agno>=3.1.11",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "nltk>=3.10.4",
    "openai>=3.41.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "regex>=2026.9.29",
    "tiktoken>=0.14.0",
    "tinycss2>=1.5.1",
    "typer>=0.27.3",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 119
target-version = "py313"
extend-exclude = [".claude/worktrees"]

[tool.ruff.format]
exclude = ["*.md"]  # Keep historical Markdown code examples outside Python formatting.
# 可选格式化相关配置（ruff formatter 从 0.4+ 开始支持）
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = 100

[tool.pytest]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]

[tool.ruff.lint]
extend-select = ["I"]
extend-safe-fixes = ["E", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["engine"]

[tool.pyright]
include = ["main.py", "engine", "tests"]
exclude = [
    ".claude/worktrees",
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist",
]
pythonVersion = "3.13"
pythonPlatform = "Linux"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.coverage.run]
source = ["engine"]
omit = [
    "*/tests/*",
    "*/services/glossary.py",  # 需要外部 EPUB 和 NLTK，难以单元测试
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
